name: Build Medicine Stock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract app project
        run: |
          mkdir project
          unzip -q MedicineStockNew.zip -d project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicineStock-APK
          path: project/app/build/outputs/apk/debug/*.apk
